<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>user directory</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main> </main>
    
  <header>
    <h1>User Directory</h1>
    <p>Explore users and their contact information.</p>
  </header>

  
  <div class="search-section">
    <input type="text" id="search-input" placeholder="Search users..." />
    <p id="results-count"></p>
  </div>

  <p id="status-message"></p>

  
  <div id="user-grid"></div>

  
  <div id="user-modal" class="hidden">
    <div class="modal-box">
      <button id="modal-close">Close</button>

      <h2 id="modal-name"></h2>
      <p id="modal-username"></p>

      <p>Email: <span id="modal-email"></span></p>
      <p>Phone: <span id="modal-phone"></span></p>
      <p>Website: <span id="modal-website"></span></p>
      <p>Address: <span id="modal-address"></span></p>
      <p>Company: <span id="modal-company"></span></p>

    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
