<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Page</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <!-- Overall Page Container -->
    <section class="parent-container">
        <div class="centered-container">
            <!-- Left Blue Steps -->
            <div class="blue-container">

                <div class="step">
                    <div class="active-number">1</div>
                    <div class="step-details">
                        <p>STEP 1</p>
                        <h4>YOUR INFO</h4>
                    </div>
                </div>

                <div class="step">
                    <div class="number">2</div>
                    <div class="step-details">
                        <p>STEP 2</p>
                        <h4>SELECT PLAN</h4>
                    </div>
                </div>

                <div class="step">
                    <div class="number">3</div>
                    <div class="step-details">
                        <p>STEP 3</p>
                        <h4>ADD-ONS</h4>
                    </div>
                </div>

                <div class="step">
                    <div class="number">4</div>
                    <div class="step-details">
                        <p>STEP 4</p>
                        <h4>SUMMARY</h4>
                    </div>

                </div>
            </div>

            <!-- Right Personal Info Box -->
            <div class="personal-info-box">
                <h1>Personal info</h1>
                <p>Please provide your name, email, and phone number.</p>
                <form>
                    <label for="name">Name</label> <br>
                    <input type="text" placeholder="e.g John Doe"> <br>

                    <label for="name">Email Address</label> <br>
                    <input type="text" placeholder="e.g johndoe@gmail.com"> <br>

                    <label for="name">Phone Number</label> <br>
                    <input type="text" placeholder="e.g +2345678900"> <br>
                </form>

                <div class="next-step">
                    <h3>Next Step</h3>
                </div>
            </div>

        </div>
    </section>

</body>

</html>
