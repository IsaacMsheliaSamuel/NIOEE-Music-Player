<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Step Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

    <!-- Left Sidebar -->
    <div class="sidebar">

        <div class="step">
            <div class="circle">1</div>

            <div class="text">
                <p>STEP 1</p>
                <h4>YOUR INFO</h4>
            </div>
        </div>

        <div class="step">
            <div class="circle">2</div>

            <div class="text">
                <p>STEP 2</p>
                <h4>SELECT PLAN</h4>
            </div>
        </div>

        <div class="step">
            <div class="circle">3</div>

            <div class="text">
                <p>STEP 3</p>
                <h4>ADD-ONS</h4>
            </div>
        </div>

        <div class="step">
            <div class="circle">4</div>

            <div class="text">
                <p>STEP 4</p>
                <h4>SUMMARY</h4>
            </div>
        </div>

    </div>

    <!-- Right Content -->
    <div class="content">

        <h1>Personal Info</h1>

        <p class="description">
            Please provide your name, email address, and phone number.
        </p>

        <form>

            <label>Name</label>
            <input type="text" placeholder="e.g Stephen King">

            <label>Email Address</label>
            <input type="email" placeholder="e.g stephenking@email.com">

            <label>Phone Number</label>
            <input type="tel" placeholder="e.g +1 234 567 890">

            <button>Next Step</button>

        </form>

    </div>

</div>

</body>
</html>
