<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!--
    TASK: Build the layout for your Weather App.

    Your page should include:

    1. A header with the app title and (bonus) a "Use my location" button

    2. A search section:
       - A text input for the city name
       - A submit button
       Hint: wrap them in a <form> so you can listen for the "submit" event

    3. A loading indicator (hidden by default):
       - Show this while waiting for the API response
       - Hide it once data arrives or an error occurs

    4. An error message area (hidden by default):
       - Display a friendly message when a city is not found

    5. A weather card (hidden by default) that shows:
       - City name
       - Weather icon  <img> tag — you'll set the src from the API
       - Temperature   give this element an id so JS can update it
       - Weather condition (e.g. "clear sky")
       - Humidity
       - Wind speed

    6. (Bonus) A 5-day forecast section (hidden by default):
       - A container where JS will inject forecast cards

    7. (Bonus) A search history bar (hidden by default):
       - Dynamically populated by JS with recent searches

    Tips:
    - Use id attributes on elements you need to read or update from JavaScript
    - Use a CSS class like "hidden" (display: none) to toggle visibility
    - Link your script.js at the bottom of <body>
  -->

  <script src="script.js"></script>
</body>
</html>
