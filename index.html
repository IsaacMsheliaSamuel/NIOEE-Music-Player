<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIOEE Music Player</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/player.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <main id="app">
        <!-- ========================= HOME (MAZTAH) ========================== -->
        <section class="app-page" id="home-page" data-page="home">
            <h1>NIOEE</h1>
            <h2>Home</h2>
            <p>Welcome to NIOEE Music.</p>
            <div class="test-navigation">
                <button data-navigate="search"> Search </button>
                <button data-navigate="library"> Library </button>
                <button data-navigate="playlist"> Playlist </button>
            </div>

            <div class="test-song-list">
                <h3>Test Songs</h3>
                <button data-play-track="0"> Play Song 1 </button>
                <button data-play-track="1"> Play Song 2 </button>
                <button data-play-track="2"> Play Song 3 </button>
            </div>
        </section>

        <!-- ========================= SEARCH (OLUMIDE)========================== -->
        <section class="app-page" id="search-page" data-page="search" hidden>
            <button class="page-back-btn" data-back> ← Back </button>
            <h1>Search</h1>
            <p>Temporary Search screen.</p>
            <button data-play-track="0"> Play Song 1 </button>
        </section>


        <!-- ========================= LIBRARY (ELIJAH)========================== -->
        <section class="app-page" id="library-page" data-page="library" hidden>
            <button class="page-back-btn" data-back> ← Back </button>
            <h1>Library</h1>
            <p>Temporary Library screen.</p>
            <button data-play-track="1"> Play Song 2 </button>
        </section>

        <!-- ========================= PLAYLIST (ENOCH)========================== -->
        <section class="app-page" id="playlist-page" data-page="playlist" hidden>
            <button class="page-back-btn" data-back> ← Back </button>
            <h1>Playlist</h1>
            <p>Temporary Playlist screen.</p>
            <button data-play-track="2"> Play Song 3 </button>
        </section>

        <!-- ========================= NOW PLAYING (ISAAC) ========================== -->
        <section class="app-page now-playing" id="now-playing-page" data-page="now-playing" hidden>
            <button class="back-btn" aria-label="Go back"> ← </button>
            <div class="player-content">
                <!-- Album Artwork -->
                <div class="album-art">
                    <img src="" alt="Album cover" id="album-cover">
                </div>

                <!-- Song Information -->
                <div class="song-info">
                    <h1 id="song-title"> Born Winner </h1>
                    <p id="song-artist"> Burna Boy </p>
                </div>

                <!-- Progress -->
                <div class="progress-section">
                    <div class="progress-times">
                        <span id="current-time"> 0:00  </span>
                        <span id="duration"> 0:00 </span>
                    </div>
                    <input type="range" id="progress-bar" min="0" max="100" value="0" aria-label="Song progress">
                </div>

                <!-- ==================== Main Controls ==================== -->
                <div class="main-controls">
                    <button id="shuffle-btn" aria-label="Shuffle"> 🔀 </button>
                    <button id="previous-btn" aria-label="Previous song"> ⏮ </button>
                    <button id="play-btn" class="play-btn" aria-label="Play"> ▶ </button>
                    <button id="next-btn" aria-label="Next song"> ⏭ </button>
                    <button id="repeat-btn" aria-label="Repeat"> 🔁 </button>
                </div>

                <!-- Like -->
                <!-- <div class="player-options">
                    <button id="like-btn" aria-label="Like song"> ♡
                        <span>Like</span>
                    </button>
                </div> -->
            </div>
        </section>


        <!-- ========================= MINI PLAYER ========================== -->

        <section class="mini-player" id="mini-player">
            <!-- Current Song -->
            <div class="mini-song" id="mini-song" data-navigate="now-playing">
                <img src="" alt="Album cover" id="mini-album-cover">
                <div>
                    <h2 id="mini-song-title"> Born Winner</h2>
                    <p id="mini-song-artist"> Burna Boy</p>
                </div>
            </div>

            <!-- Like -->
            <!-- <button id="mini-like-btn" aria-label="Like song">    </button> -->

            <!-- Mini Controls -->
            <div class="mini-controls">
                <button id="mini-shuffle-btn" aria-label="Shuffle"> 🔀 </button>
                <button id="mini-previous-btn" aria-label="Previous song"> ⏮ </button>
                <button id="mini-play-btn" aria-label="Play"> ▶ </button>
                <button id="mini-next-btn" aria-label="Next song"> ⏭ </button>
                <button id="mini-repeat-btn" aria-label="Repeat">  🔁 </button>
            </div>

            <!-- Volume -->
            <div class="volume-control">
                <button id="mute-btn" aria-label="Mute"> 🔊 </button>
                <input type="range" id="volume-bar" min="0" max="100" value="100" aria-label="Volume">
            </div>
        </section>
    </main>

    <!-- =========================JAVASCRIPT ========================== -->
    <script src="js/playlist.js"></script>
    <script src="js/app.js"></script>
    <script src="js/player.js"></script>
</body>
</html>
