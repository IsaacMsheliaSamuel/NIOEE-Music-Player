<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NIOEE Music Player</title>

    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/home.css">
    <link rel="stylesheet" href="css/search.css">
    <link rel="stylesheet" href="css/playlist.css">
    <link rel="stylesheet" href="css/eli-playlist.css">
    <link rel="stylesheet" href="css/player.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>


<body>


    <!-- Sidebar -->

    <aside class="sidebar">

        <!-- Logo -->
        <div class="logo">
            <h1>NIOEE</h1>
        </div>


        <!-- Main Navigation -->

        <nav class="main-navigation">

            <a href="#" class="nav-link active" data-navigate="home">
                <span>Home</span>
            </a>


            <a href="#" class="nav-link" data-navigate="playlist">
                <span>Playlist</span>
            </a>


            <a href="#" class="nav-link" data-navigate="search">
                <span>Search</span>
            </a>

        </nav>

    </aside>



    <!-- Main Content -->

    <main id="app" class="main-content">


        <!-- ========================= HOME (MAZTAH) ========================== -->

        <section class="app-page home-page" id="home-page" data-page="home">


            <!-- Header -->

            <header class="main-header">

                <div class="greeting">

                    <p>Good day,</p>

                    <h1>fam</h1>

                </div>


                <div class="header-profile">

                    <img src="assets/images/NIOEE logo.jpeg" alt="Profile picture">

                </div>

            </header>



            <!-- Jump Back In -->

            <section class="jump-back-in">

                <div class="section-header">

                    <h2>Jump back in</h2>
                </div>


                <div class="quick-cards" id="jump-back-cards">

                    <!-- Home cards will be created by home.js -->

                </div>

            </section>



            <!-- Recently Played Section -->

            <section class="recently-played">

                <div class="section-header">

                    <h2>Recently played</h2>
                </div>


                <div class="music-grid" id="recently-played-cards">

                    <!-- Home cards will be created by home.js -->

                </div>

            </section>



            <!-- Made For You -->

            <section class="made-for-you">

                <div class="section-header">

                    <h2>Made for you</h2>
                </div>


                <div class="music-grid" id="made-for-you-cards">

                    <!-- Home cards will be created by home.js -->

                </div>

            </section>


        </section>



        <!-- ========================= SEARCH (OLUMIDE) ========================== -->

        <section class="app-page" id="search-page" data-page="search" hidden>

            <header class="search-header">
                <button class="page-back-btn" data-back> ← Back </button>
                <div class="search-bar">
                    <h1 class="search-header">Search</h1>
                    <input type="text" placeholder="search songs or playlists" class="search-input" />
                </div>
            </header>
            <main>
                <div>
                    <h2>Results</h2>
                    <ul class="recents">
                        <li></li>
                    </ul>
                </div>
            </main>
        </section>



        <!-- ========================= PLAYLIST (ELI) ========================== -->

        <section class="app-page" id="playlist-page" data-page="playlist" hidden>

            <button class="page-back-btn" data-back>
                ← Back
            </button>

            <h2>Playlists</h2>

            <div class="top">
                <div class="tabs">
                    <button>Favorites</button>
                    <button>Recently Added</button>
                    <button>Most Played</button>

                </div>
            </div>

        </section>



        <!-- ========================= NOW PLAYING (ISAAC) ========================== -->

        <section class="app-page now-playing" id="now-playing-page" data-page="now-playing" hidden>

            <button class="back-btn" aria-label="Go back">
                ←
            </button>


            <div class="player-content">


                <!-- Album Artwork -->

                <div class="album-art">

                    <img src="" alt="Album cover" id="album-cover">

                </div>



                <!-- Song Information -->

                <div class="song-info">

                    <h1 id="song-title">
                        Born Winner
                    </h1>

                    <p id="song-artist">
                        Burna Boy
                    </p>

                </div>



                <!-- Progress -->

                <div class="progress-section">

                    <div class="progress-times">

                        <span id="current-time">
                            0:00
                        </span>

                        <span id="duration">
                            0:00
                        </span>

                    </div>


                    <input type="range" id="progress-bar" min="0" max="100" value="0" aria-label="Song progress">

                </div>



                <!-- Main Controls -->

                <div class="main-controls">

                    <button id="shuffle-btn" aria-label="Shuffle">
                        🔀
                    </button>


                    <button id="previous-btn" aria-label="Previous song">
                        ⏮
                    </button>


                    <button id="play-btn" class="play-btn" aria-label="Play">
                        ▶
                    </button>


                    <button id="next-btn" aria-label="Next song">
                        ⏭
                    </button>


                    <button id="repeat-btn" aria-label="Repeat">
                        🔁
                    </button>

                </div>


            </div>

        </section>


    </main>



    <!-- Music Player -->

    <footer class="mini-player" id="mini-player">


        <!-- Current Track -->

        <div class="mini-song" id="mini-song" data-navigate="now-playing">

            <img src="" alt="Album cover" id="mini-album-cover">


            <div>

                <h2 id="mini-song-title">
                    Born Winner
                </h2>

                <p id="mini-song-artist">
                    Burna Boy
                </p>

            </div>

        </div>



        <!-- Mini Player Controls -->

        <div class="mini-controls">

            <button id="mini-shuffle-btn" aria-label="Shuffle">
                🔀
            </button>


            <button id="mini-previous-btn" aria-label="Previous song">
                ⏮
            </button>


            <button id="mini-play-btn" aria-label="Play">
                ▶
            </button>


            <button id="mini-next-btn" aria-label="Next song">
                ⏭
            </button>


            <button id="mini-repeat-btn" aria-label="Repeat">
                🔁
            </button>

        </div>



        <!-- Volume -->

        <div class="volume-control">

            <button id="mute-btn" aria-label="Mute">
                🔊
            </button>


            <input type="range" id="volume-bar" min="0" max="100" value="100" aria-label="Volume">

        </div>


    </footer>



    <!-- JAVASCRIPT -->

    <script src="js/playlist.js"></script>
    <script src="js/eli-playlist.js"></script>
    <script src="js/app.js"></script>
    <script src="js/player.js"></script>
    <script src="js/home.js"></script>
    <script src="js/search.js"></script>

</body>

</html>
